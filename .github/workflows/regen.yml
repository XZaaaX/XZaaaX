name: regen-readme-sections

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate SVG sections from GitHub API
        run: python regen.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sec-*.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "regen: refresh stats/projects/languages/contributions"
            git push
          fi
